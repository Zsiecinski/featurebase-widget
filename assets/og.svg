<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Loop — close the feedback loop in Messenger">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <circle cx="240" cy="540" r="380" fill="url(#ogGlow)"/>

  <!-- Icon, left side -->
  <g transform="translate(96,175)">
    <rect width="280" height="280" rx="62" ry="62" fill="#FFFFFF" fill-opacity="0.12"/>
    <path d="M 56 140
             C 56 92 116 92 140 140
             C 164 188 224 188 224 140
             C 224 92 164 92 140 140
             C 116 188 56 188 56 140 Z"
          transform="translate(0,0)"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Text block, right side -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="448" y="285"
          font-size="124"
          font-weight="700"
          letter-spacing="-5"
          fill="#FFFFFF">Loop</text>
    <text x="450" y="355"
          font-size="34"
          font-weight="500"
          letter-spacing="-0.5"
          fill="#FFFFFF"
          fill-opacity="0.92">Close the feedback loop in Messenger.</text>
    <text x="450" y="450"
          font-size="22"
          font-weight="500"
          letter-spacing="0.5"
          fill="#FFFFFF"
          fill-opacity="0.7">FEATUREBASE  ·  INTERCOM CANVAS KIT</text>
  </g>
</svg>
